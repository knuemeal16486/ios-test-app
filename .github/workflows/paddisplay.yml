name: PadDisplay

on:
  push:
    paths: ["PadDisplay/**", ".github/workflows/paddisplay.yml"]
  pull_request:
    paths: ["PadDisplay/**", ".github/workflows/paddisplay.yml"]

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: PadDisplay
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build macOS host
        run: |
          xcodebuild -project PadDisplay.xcodeproj -scheme PadDisplayHost \
            -destination 'generic/platform=macOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Build iPad client
        run: |
          xcodebuild -project PadDisplay.xcodeproj -scheme PadDisplayClient \
            -destination 'generic/platform=iOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -quiet build
